name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 1.7, without the v)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The workflow cannot compile UnrealScript (ucc needs the retail game
      # files), so it packages the binary committed by make.sh. The script
      # fails if prebuilt/ is older than source/.
      - name: Build release zip
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: tools/package.sh "${VERSION#v}"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/RespawnDelay-*.zip"

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: RespawnDelay-${{ inputs.version }}
          path: "dist/RespawnDelay-*.zip"
