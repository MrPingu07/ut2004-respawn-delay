name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .zip from the tag
        run: |
          git archive --format=zip \
            --output="ut2004-respawn-delay_${GITHUB_REF_NAME}.zip" \
            "${GITHUB_REF_NAME}"

      - name: Create GitHub release with .zip asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "ut2004-respawn-delay_${GITHUB_REF_NAME}.zip" \
            --title "Respawn Delay ${GITHUB_REF_NAME}" \
            --generate-notes
